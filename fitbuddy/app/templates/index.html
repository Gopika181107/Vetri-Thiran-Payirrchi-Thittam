<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<title>FitBuddy - AI Workout Generator</title>
</head>
<body>
<main class="wrap">
  <div class="panel">
    <h1>💪 FitBuddy - AI Workout Generator</h1>
    {% if error %}<div class="msg err" role="alert">{{ error }}</div>{% endif %}
    <form action="/generate-workout" method="post">
      <label for="username">Name</label>
      <input id="username" name="username" type="text" required>

      <label for="user_id">User ID</label>
      <input id="user_id" name="user_id" type="number" min="1" required>

      <label for="age">Age</label>
      <input id="age" name="age" type="number" min="10" max="100" required>

      <label for="weight">Weight (kg)</label>
      <input id="weight" name="weight" type="number" step="0.1" min="20" max="400" required>

      <label for="goal">Fitness goal</label>
      <input id="goal" name="goal" type="text" placeholder="e.g., weight loss, muscle gain, flexibility" required>

      <label for="intensity">Workout intensity</label>
      <select id="intensity" name="intensity" required>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate plan</button>
    </form>
  </div>
  <div class="topbar"><a class="btn ghost" href="/view-all-users">Coach dashboard</a></div>
</main>
</body>
</html>
